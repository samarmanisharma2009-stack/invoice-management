<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice · Invoice Management System</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar no-print">
    <div class="brand">🧾 Invoice Manager</div>
    <nav>
      <a href="/dashboard.html">Invoices</a>
      <a href="/invoice.html">New Invoice</a>
      <button id="logoutBtn">Log out</button>
    </nav>
  </div>

  <div class="container">
    <div id="alertBox"></div>

    <div class="card">
      <h1 id="pageTitle">New Invoice</h1>

      <div class="form-grid">
        <div class="field">
          <label for="customerSelect">Customer</label>
          <select id="customerSelect"></select>
        </div>
        <div class="field no-print">
          <label for="newCustomerName">Or add a new customer</label>
          <input type="text" id="newCustomerName" placeholder="Customer name">
        </div>
        <div class="field">
          <label for="invoiceDate">Invoice Date</label>
          <input type="date" id="invoiceDate" required>
        </div>
        <div class="field">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate">
        </div>
        <div class="field">
          <label for="statusSelect">Status</label>
          <select id="statusSelect">
            <option value="Draft">Draft</option>
            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <h2>Items</h2>
      <div id="itemsContainer"></div>
      <button type="button" class="btn secondary small no-print" id="addItemBtn">+ Add Item</button>

      <div class="field" style="margin-top:16px;">
        <label for="discountInput">Discount</label>
        <input type="number" id="discountInput" min="0" step="0.01" value="0" style="max-width:160px;">
      </div>

      <div class="field">
        <label for="notesInput">Notes</label>
        <textarea id="notesInput" maxlength="2000"></textarea>
      </div>

      <div class="totals-box">
        <div class="row"><span>Subtotal</span><span id="subtotalDisplay">0.00</span></div>
        <div class="row"><span>Tax</span><span id="taxDisplay">0.00</span></div>
        <div class="row"><span>Discount</span><span id="discountDisplay">0.00</span></div>
        <div class="row total"><span>Total</span><span id="totalDisplay">0.00</span></div>
      </div>
      <p style="color:var(--text-muted); font-size:0.8rem;">
        Totals are calculated and validated by the server; the numbers above update live as a preview.
      </p>

      <div class="no-print" style="margin-top:20px; display:flex; gap:10px;">
        <button class="btn" id="saveBtn">Save Invoice</button>
        <button class="btn secondary" id="printBtn">Print</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/invoice.js"></script>
</body>
</html>
